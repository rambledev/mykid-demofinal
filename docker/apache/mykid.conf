# Mykid — Apache configuration (enabled with a2enconf in the Dockerfile)
#
# Only public/ is served. Every request that is not a real file in public/ goes to the front
# controller public/index.php (clean URLs, app/routes.php). app/, database/, storage/, .env and
# docs/ live outside the web root and can never be downloaded.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot /var/www/html/public

<Directory /var/www/html>
    Require all denied
    AllowOverride None
</Directory>

<Directory /var/www/html/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    FallbackResource /index.php
</Directory>

# Never serve hidden files or PHP files other than the front controller.
<Directory /var/www/html/public>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
</Directory>

# Static assets: long cache (URLs carry ?v=<mtime>), app pages send their own no-store.
<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

# Baseline headers for static files (the app adds CSP, HSTS, ... for its own responses).
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always unset X-Powered-By
